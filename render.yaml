services:
  - type: web
    name: job-fit-ai
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: False
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        fromService:
          type: web
          name: job-fit-ai
          property: port
      - key: DATABASE_URL
        value: sqlite:///./job_fit.db
      - key: GEMINI_API_KEY
        sync: false  # Will be set manually in dashboard
